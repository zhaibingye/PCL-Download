name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Check Download Entry Points
      run: python -m unittest discover -s tests -v

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Set Commit Hash
      run: |
        $path = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        $source = [IO.File]::ReadAllText($path).Replace('Public Const CommitHash As String = ""', ('Public Const CommitHash As String = "' + $env:GITHUB_SHA + '"'))
        [IO.File]::WriteAllText($path, $source, [Text.UTF8Encoding]::new($false))
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    # Only trusted default-branch builds receive credentials. Pull requests and
    # other branches compile the empty public defaults and use runtime overrides.
    - name: Generate Private Build Credentials
      if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      env:
        PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
        PCL_CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      run: python .github/scripts/build_credentials.py

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }} -verbosity:minimal -nologo

    - name: Verify Compiled Credentials
      if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: powershell
      env:
        PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
        PCL_CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      run: .\.github\scripts\verify_build_credentials.ps1 -AssemblyPath "Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe"

    - name: Remove Private Build Source
      if: always()
      run: python .github/scripts/build_credentials.py --clean

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
        if-no-files-found: error
